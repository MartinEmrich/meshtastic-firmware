[env:tlora-v2-1-1_6-pioarduino]
extends = esp32_base
board = ttgo-lora32-v21
board_check = true

## unset this (TODO). It triggers compiling empty wrappers around some flash chip code, which also seems to be picked up by framework "Hybrid Compile" and messing that up.
## -> fails to boot.
custom_esp32_kind = ""

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

custom_sdkconfig =
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_ESP_SLEEP_GPIO_RESET_WORKAROUND=y
  CONFIG_PM_SLP_DISABLE_GPIO=y
#  CONFIG_PM_SLP_IRAM_OPT=y
  CONFIG_BT_CTRL_MODEM_SLEEP=y
  CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
  CONFIG_BT_CTRL_LPCLK_SEL_EXT_32K_XTAL=y
# from esp32.ini
  CONFIG_BT_NIMBLE_MAX_BONDS=6
  CONFIG_NIMBLE_CPP_LOG_LEVEL=2
  CONFIG_BT_NIMBLE_MAX_CCCDS=20
  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
  CONFIG_AUTOSTART_ARDUINO=y
# Meshtastic uses old API, TODO
  CONFIG_ADC_SUPPRESS_DEPRECATE_WARN=y
  CONFIG_ADC_SKIP_LEGACY_CONFLICT_CHECK=y
  CONFIG_PM_DFS_INIT_AUTO=y

# Trying to remove ethernet...
  CONFIG_ETH_SPI_ETHERNET_DM9051=n
  CONFIG_ETH_SPI_ETHERNET_W5500=n
  CONFIG_ETH_SPI_ETHERNET_KSZ8851SNL=n

# Tips from https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/performance/ram-usage.html#optimize-iram-usage
#  CONFIG_FREERTOS_IN_IRAM=n
#  CONFIG_RINGBUF_IN_IRAM=n
#  CONFIG_ESP_WIFI_IRAM_OPT=n # lowers Wifi performance
#  CONFIG_ESP_WIFI_RX_IRAM_OPT=n # lowers Wifi performance
#  CONFIG_SPI_MASTER_ISR_IN_IRAM=n # lowers flash write performance
#  CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH=y # might be unsafe if heap functions are used incorrectly from ISRs
#  CONFIG_SPI_FLASH_PLACE_FUNCTIONS_IN_IRAM=y
#  CONFIG_SPI_MASTER_IN_IRAM=y
#  CONFIG_SPI_MASTER_ISR_IN_IRAM=y
  
# disable unused flash chips (like in esp32_extra via custom_esp32_kind=esp32 ??)
  CONFIG_SPI_FLASH_VENDOR_XMC_SUPPORT_ENABLED=y
  CONFIG_SPI_FLASH_VENDOR_MXIC_SUPPORT_ENABLED=y
  CONFIG_SPI_FLASH_VENDOR_GD_SUPPORT_ENABLED=n
  CONFIG_SPI_FLASH_VENDOR_ISSI_SUPPORT_ENABLED=n
  CONFIG_SPI_FLASH_VENDOR_WINBOND_SUPPORT_ENABLED=n

# via custom_sdkconfig, do not redefine. does not work, see below
build_unflags = 
  ${esp32_base.build_unflags}
  -DCONFIG_BT_NIMBLE_MAX_BONDS=6
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=20
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

build_flags =
  ${arduino_base.build_flags}
#  -flto #not working with pioarduino
  -Wall
  -Wextra
  -Isrc/platform/esp32
  -std=c++11
  -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
  -DMYNEWT_VAL_BLE_HS_LOG_LVL=LOG_LEVEL_CRITICAL
  -DAXP_DEBUG_PORT=Serial
  -DESP_OPENSSL_SUPPRESS_LEGACY_WARNING
  -DSERIAL_BUFFER_SIZE=4096
  -DSERIAL_HAS_ON_RECEIVE
  -DHAS_UDP_MULTICAST=1
#  -DDEBUG_HEAP
  -Ivariants/esp32/tlora_v2_1_16_pioarduino

# ..and ours
  -D TLORA_V2_1_16 
  -D PIOARDUINO_ESP32 # introduced here
# customization
  -D PowerFSMDebug
  -D DEBUG_LOOP_TIMING
# Issue with "dangerous relocation: l32r: literal placed after use: (.literal._ZN15SX126xInterfaceI6SX1262E16disableInterruptEv+0x8)"
  -mtext-section-literals
# supposed to fix on tlora2
  -D USE_HSPI_PORT

# does not like pioarduino
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER
## ... too fat, go on diet:
  -D MESHTASTIC_EXCLUDE_GPS
  -D MESHTASTIC_EXCLUDE_AUDIO
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE
  -D MESHTASTIC_EXCLUDE_STOREFORWARD
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -D MESHTASTIC_EXCLUDE_ATAK
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES
  -D MESHTASTIC_EXCLUDE_POWERSTRESS
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION
  -D MESHTASTIC_EXCLUDE_WAYPOINT
  # no wifi
  -D MESHTASTIC_EXCLUDE_WIFI
  -D MESHTASTIC_EXCLUDE_MQTT
  # CCACHE for IDF
  -D IDF_CCACHE_ENABLE=1

lib_ignore =
  ${esp32_base.lib_ignore}
  libpax
  ESP RainMaker
  ESP Insights
  Matter
  Zigbee
#  dsp
  Insights

# Taken from ESP example, seems to be useless
custom_component_remove = espressif/esp_hosted
                          espressif/esp_wifi_remote
                          espressif/network_provisioning
                          espressif/esp-dsp
                          espressif/esp_modem
                          espressif/esp32-camera
                          espressif/libsodium
                          espressif/esp-modbus
                          espressif/qrcode
                          espressif/esp_insights
                          espressif/esp_diag_data_store
                          espressif/esp_diagnostics
                          espressif/cbor
                          espressif/esp_rainmaker
                          espressif/rmaker_common
                          chmorgan/esp-libhelix-mp3
                          espressif/lan867x
                          espressif/esp-zboss-lib
                          espressif/esp-zigbee-lib
                          espressif/fb_gfx
                          espressif/lan86xx_common

# Disable some memory-hungry and/or in a stationary node scenario 
# lesser useful features to free memory on PSRAM-less device
[env:tlora-v2-1-1_6_wifi_light]
extends = esp32_base
board = ttgo-lora32-v21
board_check = true
build_flags =
  ${esp32_base.build_flags} -D TLORA_V2_1_16 -I variants/esp32/tlora_v2_1_16
   -D MESHTASTIC_EXCLUDE_GPS=1
   -D MESHTASTIC_EXCLUDE_I2C=1
   -D MESHTASTIC_EXCLUDE_AUDIO=1
   -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
   -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
   -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
   -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
   -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
   -D MESHTASTIC_EXCLUDE_ATAK=1
   -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
   -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
# lower static allocated memory for MQTT buffers
   -D MAX_MQTT_PROXY_MESSAGES=4
   -D MAX_QUEUE_STATUS=2
   -D MAX_CLIENT_NOTIFICATIONS=2

# TODO: check if single onboard-button needs this.
   -D MESHTASTIC_EXCLUDE_INPUTBROKER=1

# Might be useful on stationary node
#   -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
#   -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
#   -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
#   -D MESHTASTIC_EXCLUDE_RANGETEST=1
#   -D MESHTASTIC_EXCLUDE_TEXTMESSAGE=1
#   -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
#   -D MESHTASTIC_EXCLUDE_WAYPOINT=1
#   -D MESHTASTIC_EXCLUDE_SERIAL=1

lib_ignore =
  libpax

upload_speed = 921600

[env:sugarcube]
extends = env:tlora-v2-1-1_6
board_level = extra
build_flags =
  ${env:tlora-v2-1-1_6.build_flags}
  -DBUTTON_PIN=0
  -DPIN_BUZZER=25
  -DLED_PIN=-1
